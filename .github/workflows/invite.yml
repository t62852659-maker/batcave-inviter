name: Inviter

# Started BY HAND, with the name and the room typed in.
#
# There is deliberately no push trigger. Every push to the bot repos today
# restarted a live fleet, and four of those in a few minutes earned a Z-line on
# the whole address range. An inviter is something you start when you want it,
# not something that redeploys because a comment changed.
on:
  workflow_dispatch:
    inputs:
      nick:
        description: 'What the bot is called on IRC (it identifies to NickServ as this)'
        required: true
        default: 'hmmm'
      room:
        description: 'The room it invites people INTO (you need ops there if it is +i)'
        required: true
        default: '#adultmasti'
      sources:
        description: 'Rooms to find people IN, comma separated'
        required: true
        default: '#desiadda,#chatsansar'
      target:
        description: 'Who to invite'
        required: true
        default: 'feminine'
        type: choice
        options: [feminine, other, all]
      landing:
        description: 'The room it sits in, idle, waiting to be told to start'
        required: true
        default: '#desiadda'
      dry_run:
        description: 'Check it starts and connects, then stop without inviting anyone'
        required: false
        default: false
        type: boolean

# One inviter at a time. A second run waits rather than putting two bots with
# the same nick on the network, which is a collision and a rename loop.
concurrency:
  group: inviter
  cancel-in-progress: false

jobs:
  invite:
    runs-on: ubuntu-latest
    # Fixed rather than an input. An expression here that fails to parse fails
    # the whole run before a single line of the bot executes, and 350 is the
    # ceiling anyway — cancel the run from the Actions page to stop early.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Invite
        env:
          NICKSERV_PASS: ${{ secrets.NICKSERV_PASS }}
          IRC_SERVER: ${{ secrets.IRC_SERVER || 'irc.hybridirc.com' }}
          IRC_PORT: ${{ secrets.IRC_PORT || '6697' }}
          RECRUIT_TARGET: ${{ inputs.target }}
          RECRUIT_PER_ROUND: ${{ secrets.RECRUIT_PER_ROUND || '3' }}
          RECRUIT_MIN_GAP_MIN: ${{ secrets.RECRUIT_MIN_GAP_MIN || '1' }}
          RECRUIT_MAX_GAP_MIN: ${{ secrets.RECRUIT_MAX_GAP_MIN || '2' }}
          RECRUIT_REASK_DAYS: ${{ secrets.RECRUIT_REASK_DAYS || '21' }}
          FEMININE_HINTS: ${{ secrets.FEMININE_HINTS }}
          DRY_RUN: ${{ inputs.dry_run }}
          LANDING_ROOM: ${{ inputs.landing }}
          # Only this nick may command the bot, and only while identified to
          # services — the nick alone is a claim anybody can make.
          CONTROLLERS: ${{ secrets.CONTROLLERS || 'Vampire' }}
        run: |
          node test.js
          node invite.js "${{ inputs.nick }}" "${{ inputs.room }}" "${{ inputs.sources }}"
